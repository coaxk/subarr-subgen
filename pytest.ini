[pytest]
# Collect only OUR tests. Without this, a bare `pytest` from the repo root walks
# into upstream/ -- the McCloudS/subgen submodule -- and reports 7 collection
# errors from THEIR suite (it needs python-multipart, which we do not install).
#
# That matters beyond tidiness: those errors look exactly like our tests failing.
# Anyone running the natural bare `pytest` would see red and have to work out
# that none of it is ours. A harness whose failures are not ours is a harness
# that gets ignored.
#
# smoke_patched_behaviour.py is deliberately NOT collected -- it is a standalone
# script needing the built image on PYTHONPATH, run directly with python. It does
# not match test_*.py so it is excluded by the default pattern anyway; noted here
# so nobody "fixes" its name later and breaks it.
testpaths = tests
norecursedirs = upstream build .git
